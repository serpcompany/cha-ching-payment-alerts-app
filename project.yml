name: Cha-Ching
options:
  bundleIdPrefix: com.serpcompany
  developmentLanguage: en

settings:
  base:
    PRODUCT_NAME: Cha-Ching
    DEVELOPMENT_TEAM: 847HR8U8D9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 37
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ChaChingDollarIcon
  configs:
    Debug:
      API_BASE_URL: http://127.0.0.1:8787
      APS_ENVIRONMENT: development
    Release:
      API_BASE_URL: https://cha-ching-api.serpcompany.workers.dev
      APS_ENVIRONMENT: production
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_NS_ASSERTIONS: NO

targets:
  Cha-Ching:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.chaching
        CODE_SIGN_ENTITLEMENTS: Cha-Ching/ChaChing.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ChaChingDollarIcon
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: ChaChing.storekit
    entitlements:
      path: Cha-Ching/ChaChing.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: Cha-Ching
    info:
      path: Cha-Ching/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: ChaChingDollarIcon
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [ arm64 ]
        API_BASE_URL: $(API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.serpcompany.chaching.oauth
            CFBundleURLSchemes:
              - chaching
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  Cha-ChingTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Cha-ChingTests
    dependencies:
      - target: Cha-Ching
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: Cha_ChingTests
        PRODUCT_NAME: Cha-ChingTests

  Cha-ChingUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Cha-ChingUITests
    dependencies:
      - target: Cha-Ching
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_MODULE_NAME: Cha_ChingUITests
        PRODUCT_NAME: Cha-ChingUITests

schemes:
  Cha-Ching:
    build:
      targets:
        Cha-Ching: all
    run:
      config: Debug
      storeKitConfiguration: Cha-Ching/StoreKit/ChaChing.storekit
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - Cha-ChingTests
        - Cha-ChingUITests

  Cha-Ching Local StoreKit E2E:
    build:
      targets:
        Cha-Ching: all
    test:
      config: Debug
      environmentVariables:
        RUN_LOCAL_STOREKIT_E2E: '1'
      targets:
        - Cha-ChingTests
