name: Cha-Ching
options:
  bundleIdPrefix: com.serpcompany
  developmentLanguage: en

settings:
  base:
    PRODUCT_NAME: Cha-Ching
    DEVELOPMENT_TEAM: 847HR8U8D9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 3
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Debug:
      API_BASE_URL: http://127.0.0.1:8787
      APS_ENVIRONMENT: development
    Release:
      API_BASE_URL: https://cha-ching-api.serpcompany.workers.dev
      APS_ENVIRONMENT: production
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_NS_ASSERTIONS: NO

targets:
  Cha-Ching:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.serpcompany.chaching
        CODE_SIGN_ENTITLEMENTS: Cha-Ching/ChaChing.entitlements
    entitlements:
      path: Cha-Ching/ChaChing.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: Cha-Ching
    info:
      path: Cha-Ching/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [ arm64 ]
        API_BASE_URL: $(API_BASE_URL)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.serpcompany.chaching.oauth
            CFBundleURLSchemes:
              - chaching
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  Cha-Ching:
    build:
      targets:
        Cha-Ching: all
    run:
      config: Debug
    archive:
      config: Release
