name: Sales Ping
options:
  bundleIdPrefix: com.superapp
  developmentLanguage: en

settings:
  base:
    PRODUCT_NAME: Sales Ping
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: '-O'
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_NS_ASSERTIONS: NO

targets:
  Sales Ping:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superapp.salesping
        CODE_SIGN_ENTITLEMENTS: Sales Ping/SalesPing.entitlements
    entitlements:
      path: Sales Ping/SalesPing.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    sources:
      - path: Sales Ping
    info:
      path: Sales Ping/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [ arm64 ]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: supabase-swift
        product: Supabase

schemes:
  Sales Ping:
    build:
      targets:
        Sales Ping: all
    run:
      config: Debug
    archive:
      config: Release
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
