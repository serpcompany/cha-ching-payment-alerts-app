name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types and tests
        run: pnpm check

      - name: Verify generated Worker bindings
        run: pnpm exec wrangler types --check

      - name: Verify Worker bundle
        run: pnpm exec wrangler deploy --dry-run

  ios:
    name: iOS Simulator build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build unsigned app
        run: >-
          xcodebuild
          -project "Cha-Ching.xcodeproj"
          -scheme "Cha-Ching"
          -configuration Debug
          -destination "generic/platform=iOS Simulator"
          -derivedDataPath "$RUNNER_TEMP/ChaChingDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build
