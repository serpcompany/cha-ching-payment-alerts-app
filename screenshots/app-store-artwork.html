<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cha-Ching App Store artwork</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        --midnight: #071522;
        --deep-card: #0d1d2a;
        --mint: #39e6a3;
        --gold: #f5b942;
        --cloud: #f4f9f6;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 1320px;
        height: 2868px;
        margin: 0;
        overflow: hidden;
      }

      body { background: var(--midnight); }

      .artboard {
        position: relative;
        width: 1320px;
        height: 2868px;
        overflow: hidden;
        isolation: isolate;
      }

      .artboard::before,
      .artboard::after {
        content: "";
        position: absolute;
        z-index: -1;
        border-radius: 999px;
        filter: blur(2px);
      }

      .dark {
        color: var(--cloud);
        background:
          radial-gradient(circle at 50% 80%, #0a715d 0, #0a715d00 30%),
          radial-gradient(circle at 18% 12%, #11365b 0, #11365b00 34%),
          linear-gradient(160deg, #071522 0%, #06101a 100%);
      }

      .dark::before {
        width: 960px;
        height: 960px;
        right: -550px;
        top: 90px;
        border: 7px solid color-mix(in srgb, var(--gold) 68%, transparent);
        box-shadow: 0 0 0 42px #f5b94216, 0 0 0 84px #f5b9420c;
      }

      .light {
        color: var(--midnight);
        background:
          radial-gradient(circle at 82% 17%, #39e6a32b 0, #39e6a300 31%),
          linear-gradient(150deg, #ffffff 0%, var(--cloud) 62%, #e5f5ef 100%);
      }

      .light::after {
        width: 1000px;
        height: 1350px;
        left: 160px;
        bottom: -250px;
        border-radius: 180px;
        background: var(--midnight);
        box-shadow: 0 0 90px #07152233;
      }

      .brand-mark {
        position: absolute;
        z-index: 3;
        width: 164px;
        height: 164px;
        top: 72px;
        left: 578px;
        border-radius: 38px;
        background: var(--midnight) url("../Cha-Ching/Assets.xcassets/ChaChingDollarIcon.appiconset/ChaChingDollarAppIcon.png") center / cover no-repeat;
        filter: drop-shadow(0 16px 28px #0007);
      }

      .copy {
        position: absolute;
        z-index: 3;
        left: 104px;
        right: 104px;
        top: 270px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 142px;
        line-height: .96;
        letter-spacing: -7px;
        font-weight: 900;
      }

      h1 span { color: var(--mint); }
      .payment h1 span:last-child { color: var(--gold); }

      p {
        margin: 40px 0 0;
        font-size: 52px;
        line-height: 1.2;
        font-weight: 560;
        opacity: .78;
      }

      .capture-shell {
        position: absolute;
        z-index: 2;
        overflow: hidden;
        border-radius: 112px 112px 0 0;
        box-shadow: 0 46px 120px #0008;
      }

      .capture-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 8px solid #ffffff42;
        border-bottom: 0;
        border-radius: inherit;
      }

      .capture-shell img {
        display: block;
        width: 100%;
        height: auto;
      }

      .payment .capture-shell {
        left: 125px;
        top: 780px;
        width: 1070px;
        height: 2170px;
        border-radius: 118px 118px 0 0;
      }

      .payment .capture-shell img {
        width: 1070px;
      }

      .sources .copy { top: 260px; }
      .sources h1 { font-size: 132px; }
      .sources .capture-shell {
        left: 145px;
        top: 780px;
        width: 1030px;
        height: 2200px;
        transform: rotate(-1.4deg);
        transform-origin: 50% 100%;
      }

      .sources .capture-shell img { width: 1030px; }

      .alerts .copy { top: 260px; }
      .alerts h1 { font-size: 138px; }
      .alerts p { font-size: 48px; }
      .alerts .capture-shell {
        left: 135px;
        top: 850px;
        width: 1050px;
        height: 2110px;
      }

      .alerts .capture-shell img { width: 1050px; }

      .gold-lines {
        position: absolute;
        z-index: 1;
        left: -240px;
        right: -240px;
        bottom: 260px;
        height: 600px;
        border: 7px solid #f5b942aa;
        border-radius: 50%;
        box-shadow: 0 0 0 54px #f5b94218, 0 0 0 108px #f5b9420c;
      }
    </style>
  </head>
  <body>
    <main class="artboard dark payment" data-variant="payment">
      <div class="brand-mark" aria-hidden="true"></div>
      <header class="copy">
        <h1>Know the <span>moment</span><br>you <span>get paid.</span></h1>
      </header>
      <div class="capture-shell">
        <img src="raw/en-US/01-payment-moment.png" alt="A genuine iOS Cha-Ching payment notification">
      </div>
    </main>
    <script>
      const variant = new URLSearchParams(location.search).get("variant") || "payment";
      const artboard = document.querySelector(".artboard");

      if (variant === "sources") {
        artboard.className = "artboard light sources";
        artboard.innerHTML = `
          <div class="brand-mark" aria-hidden="true"></div>
          <header class="copy"><h1>Your payment sources.<br><span>One clear feed.</span></h1></header>
          <div class="capture-shell"><img src="raw/en-US/02-connect-sources.png" alt="Cha-Ching's shipping Connect screen"></div>`;
      }

      if (variant === "alerts") {
        artboard.className = "artboard dark alerts";
        artboard.innerHTML = `
          <div class="brand-mark" aria-hidden="true"></div>
          <header class="copy"><h1>Your alert.<br><span>Your details.</span></h1><p>Choose what appears—then send a real test.</p></header>
          <div class="gold-lines"></div>
          <div class="capture-shell"><img src="raw/en-US/03-custom-alerts.png" alt="Cha-Ching's shipping notification settings and preview"></div>`;
      }
    </script>
  </body>
</html>
